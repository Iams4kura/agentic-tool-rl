name: Optional Qwen adapter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qwen-adapter-contract:
    name: Qwen adapter contract (no weights)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            build-constraints.txt

      - name: Check lockfile freshness
        run: uv lock --check

      - name: Sync locked lightweight dependencies
        run: uv sync --extra dev --locked

      - name: Validate optional adapter contract and GPU configuration
        run: make qwen-check
