name: Optional Qwen adapter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-adapter-contract:
    name: Qwen adapter contract (no weights)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked lightweight dependencies
        run: uv sync --extra dev --frozen

      - name: Validate optional adapter contract and GPU configuration
        run: make qwen-check
